[project]
name = "mcp-server-exogram"
version = "0.2.0"
description = "Exogram FastMCP Server — Zero-Signup Local SQLite WAL & Cloud MCP Server for Personal Neural Network, Encrypted Memory Vault, A2UI Living Tiles, and Instinct Action Governance"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Richard Ewing", email = "engineering@exogram.ai" }]
keywords = ["mcp", "exogram", "memory", "neural-network", "governance", "runtime", "llm"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.1.2",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://exogram.ai"
Repository = "https://github.com/Richard-Ewing/exogram-sdk"
Issues = "https://github.com/Richard-Ewing/exogram-sdk/issues"
Documentation = "https://exogram.ai/docs"

[project.scripts]
mcp-server-exogram = "mcp_server_exogram:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.389", "ruff>=0.7.3", "pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
