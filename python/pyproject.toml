[project]
name = "exogram"
version = "0.2.0"
description = "Official Python Client SDK for Exogram — Personal Neural Network, Encrypted Memory Vault & Instinct Action Governance"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Richard Ewing", email = "engineering@exogram.ai" }]
keywords = ["exogram", "memory", "neural-network", "mcp", "governance", "runtime", "sdk", "agent", "llm"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://exogram.ai"
Repository = "https://github.com/Richard-Ewing/exogram-sdk"
Documentation = "https://exogram.ai/docs/sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.389", "ruff>=0.7.3", "pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
